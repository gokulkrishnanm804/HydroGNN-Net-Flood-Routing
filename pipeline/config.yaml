# =============================================================================
# HydroGNN-Net Research Pipeline Configuration
# Cauvery Basin, Tamil Nadu, India
# IEEE Final Year Project
# =============================================================================
# USAGE: All pipeline scripts read this file. Set credentials in .env or here.
# Run order:
#   python pipeline/download_all.py
#   python pipeline/preprocess.py
#   python pipeline/feature_engineering.py
#   python pipeline/build_graph.py
#   python pipeline/create_dataset.py
#   python pipeline/train.py
#   python pipeline/evaluate.py
#   python pipeline/export_model.py

project:
  title: "HydroGNN-Net: Physics-Informed Spatio-Temporal GNN for Flood Forecasting"
  version: "1.0.0"
  citation: "Cauvery Basin Flood Forecasting, IEEE 2026"

basin:
  name: "Cauvery"
  country: "India"
  state: "Tamil Nadu"
  # Bounding box: [lon_min, lat_min, lon_max, lat_max]
  bbox: [75.0, 10.0, 80.5, 13.5]
  area_km2: 81155
  area_buffer_deg: 0.5  # Extra buffer added to bbox for downloads

years:
  start: 2018
  end: 2023

temporal:
  resolution_minutes: 30       # Native GPM IMERG resolution
  lookback_steps: 48           # 48 steps × 30 min = 24 h lookback
  forecast_horizons_hours: [1, 3, 6, 12, 18, 24]
  step_size: 1                 # Sliding window step (1 = dense windows)

