      pipeline_id: "AMARAVATHI"
    - name: "HARANGI"
      cwc_name: "Harangi"
      pipeline_id: "HARANGI"
    - name: "KRS"
      cwc_name: "Krishna Raja Sagar"
      pipeline_id: "KRS"
    - name: "KABINI"
      cwc_name: "Kabini"
      pipeline_id: "KABINI"
    - name: "HEMAVATHY"
