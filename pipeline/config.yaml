# ── File Paths (relative to pipeline/) ───────────────────────────────────────
paths:
  raw_dir:          "dataset/raw"
  processed_dir:    "dataset/processed"
  graphs_dir:       "dataset/graphs"
  features_dir:     "dataset/features"
  splits_dir:       "../HydroGNN_Datasets/pytorch"
  models_dir:       "dataset/models"
  logs_dir:         "dataset/logs"
  metadata_dir:     "dataset/metadata"
  checkpoints_dir:  "dataset/models/checkpoints"

# ── Credentials ───────────────────────────────────────────────────────────────
# Leave blank here; set via environment variables in project root .env file
# NASA Earthdata: https://urs.earthdata.nasa.gov (free registration)
# Copernicus CDS: https://cds.climate.copernicus.eu (free registration)
credentials:
  earthdata_username: ""   # Or set env: NASA_EARTHDATA_USERNAME
  earthdata_password: ""   # Or set env: NASA_EARTHDATA_PASSWORD
  cds_api_file: "~/.cdsapirc"

# ── Download Settings ─────────────────────────────────────────────────────────
download:
  max_parallel: 4
  retry_attempts: 5
  retry_delay_sec: 2        # Low: first 401 on NASA GES DISC is a cookie-warm redirect
  retry_backoff: 2.0        # exponential multiplier per retry
  chunk_size_bytes: 1048576 # 1 MB streaming chunks
  timeout_sec: 300
  rate_limit_delay_sec: 1.0

# ── NASA GPM IMERG ────────────────────────────────────────────────────────────
# Product: GPM 3IMERGHH V07 (Half-Hourly Final Run)
# Resolution: 0.1 degree × 30 minutes
# Reference: Huffman et al. (2020) IMERG ATBD V06
# Access: https://gpm1.gesdisc.eosdis.nasa.gov/data/GPM_L3/GPM_3IMERGHH.07/
gpm:
  product: "GPM_3IMERGHH"
  version: "07"
  variable: "precipitationCal"
  base_url: "https://gpm1.gesdisc.eosdis.nasa.gov/data/GPM_L3/GPM_3IMERGHH.07"
  resolution_minutes: 30
  grid_resolution_deg: 0.1
  # ── Performance (producer-consumer optimized downloader) ───────────────
  workers: 4              # parallel download threads (NASA allows up to 6)
  batch_size: 100         # flush Parquet every N extracted slots
  retries: 5              # max retries per file (exponential backoff: 1→2→4→8→16s)
  timeout: 60             # HTTP request timeout in seconds
  queue_size: 50          # bounded queue between download pool and extraction worker
  resume: true            # never restart from scratch; use download_state.json
  delete_after_extract: true  # delete HDF5 immediately after extraction

# ── ERA5 (Copernicus) ─────────────────────────────────────────────────────────
# Product: ERA5 Hourly Reanalysis on Single Levels
# Reference: Hersbach et al. (2020). ERA5 global reanalysis. QJRMS.
# Access: https://cds.climate.copernicus.eu
era5:
  variables:
    - 2m_temperature
    - 2m_dewpoint_temperature
    - 10m_u_component_of_wind
    - 10m_v_component_of_wind
    - surface_pressure
    - evaporation                    # ERA5 short name: e  (total_evaporation is ambiguous on CDS v2)
    - volumetric_soil_water_layer_1
  product_type: reanalysis
  grid_resolution: 0.25
  data_format: netcdf              # CDS API v2: 'format' key is deprecated

# ── HydroRIVERS ──────────────────────────────────────────────────────────────
# Reference: Lehner, B. & Grill G. (2013) HydroRIVERS. Hydrological Processes.
# Download: https://www.hydrosheds.org/products/hydrorivers
hydrorivers:
  url: "https://data.hydrosheds.org/file/HydroRIVERS/HydroRIVERS_v10_as_shp.zip"
  region: "as"
  min_strahler_order: 3

# ── SRTM DEM ─────────────────────────────────────────────────────────────────
# Reference: Farr et al. (2007) SRTM. Reviews of Geophysics.
srtm:
  resolution_m: 30
  product: "SRTM1"

# ── Preprocessing ─────────────────────────────────────────────────────────────
preprocessing:
  max_gap_fill_hours: 6        # Maximum gap to fill via interpolation
  min_valid_pct: 70            # Minimum % valid data required per station
  missing_threshold_critical: 0.30
  missing_threshold_warning:  0.10

# ── Feature Engineering ───────────────────────────────────────────────────────
features:
  rolling_windows_hours: [1, 3, 6, 12, 24]
  ari_decay: 0.9               # Antecedent Rainfall Index decay
  upstream_tau_hours: 12       # Upstream contribution e-folding time
  normalization: "robust"      # robust | standard | minmax
  # Final 13-element feature vector per node per timestep:
  feature_names:
    # NOTE: rainfall_*h features are now derived from IMD Daily Rainfall (not GPM)
    - rainfall_1h
    - rainfall_3h
    - rainfall_6h
    - rainfall_12h
    - rainfall_24h
    - antecedent_rainfall_index
    - temperature_c
    - soil_moisture
    - wind_speed_ms
    - reservoir_release_norm
    - reservoir_storage_norm
    - upstream_contribution
    - water_level_m

# ── Graph Construction ────────────────────────────────────────────────────────
graph:
  default_velocity_kmh: 3.0   # River flow velocity for travel time estimation
  n_edge_features: 4
  n_node_features: 13
  edge_features:
    - length_km
    - elev_diff_m
    - travel_time_h
    - strahler_order

# ── Model Architecture ────────────────────────────────────────────────────────
# HydroGNN-Net: GRU → GATv2 → GraphSAGE → Multi-Horizon Head
model:
  node_features: 7
  hidden_dim: 128
  gru_layers: 2
  gat_heads: 4
  gat_layers: 2
  sage_hidden: 128
  edge_dim: 3
  dropout: 0.2
  horizons: [6, 12, 24]

# ── Training ──────────────────────────────────────────────────────────────────
training:
  epochs: 200
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  patience: 15
  min_delta: 0.001             # Minimum NSE improvement to reset patience
  scheduler: cosine
  scheduler_T_max: 100
  mse_weight: 1.0
  nse_weight: 0.3
  physics_weight: 0.1
  grad_clip: 1.0
  seed: 42
  device: auto                 # auto | cuda | cpu

# ── Split ─────────────────────────────────────────────────────────────────────
split:
  train: 0.70
  val:   0.15
  test:  0.15

# ── Evaluation ────────────────────────────────────────────────────────────────
evaluation:
  metrics: [nse, kge, rmse, mae, pbias, csi, pod, far]
  flood_threshold_ratio: 0.8
  mc_dropout_samples: 20

# ── Export ────────────────────────────────────────────────────────────────────
export:
  onnx: true
  opset_version: 14
  quantize: false

# ── IMD Rainfall ──────────────────────────────────────────────────────────────
# Official rainfall source: IMD Gridded Daily Rainfall (0.25° resolution)
# Replaced NASA GPM IMERG as of 2026-07-16 cleanup.
# Source: India Meteorological Department (IMD)
# Files: RF25_ind{YYYY}_rfp25.nc (2018–2023)
# Variable: RAINFALL (mm/day), grid: 129×135, 0.25° spacing
# Reference: Pai et al. (2014) IMD gridded daily rainfall over India.
imd_rainfall:
  source: "IMD"
  path: "dataset/raw/rainfall"
  file_pattern: "RF25_ind{year}_rfp25.nc"
  variable: "RAINFALL"
  units: "mm/day"
  resolution_deg: 0.25
  years: [2018, 2019, 2020, 2021, 2022, 2023]
  lat_range: [10.0, 13.5]    # Cauvery basin extent
  lon_range: [75.0, 80.5]    # Cauvery basin extent
  note: "GPM IMERG has been RETIRED from this project. Use IMD only."

